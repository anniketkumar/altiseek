name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux matches WSL2 (3.12) and Kaggle (3.13); Windows is the development machine.
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags; pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
