name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux matches WSL2 and the cloud notebooks; Windows is the development machine.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags; pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run pytest
