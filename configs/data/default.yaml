# prepare-data (CLAUDE.md §7). Field names, cameras and counts: docs/data_notes.md.
# The compressed (JPEG) and uncompressed (PNG) annotation files are identical apart from the
# file-name extension; use the ones matching the image version on disk.
annotations:
  train: data/raw/seadronessee_odv2/compressed/annotations/instances_train.json
  val: data/raw/seadronessee_odv2/compressed/annotations/instances_val.json
out_dir: data/processed
figures_dir: docs/figures
images:
  version: compressed
  root: data/raw/seadronessee_odv2/compressed/images
  webdav_url: https://cloud.cs.uni-tuebingen.de/public.php/webdav
  share_token: ZZxX65FGnQ8zjBP  # public ODv2 share (docs/data_notes.md)
horizon_fit:
  camera_groups: [mavic_4k]  # the only 4K group with open-sea (North Sea) footage
  latitude_deg: [53.0, 54.5]  # North Sea site; Lake Constance horizons are shorelines
  # Horizon in view (VFOV/2 is about 20 deg). Steady low pitches (e.g. 1.6 deg in
  # NorthSea_Fri_DJI_0110) separate the gimbal bias from the focal length.
  pitch_deg: [1.0, 17.0]
  steady_window_s: 2.0
  steady_tol_deg: 0.3
  frames_per_video: 15
  min_inlier_strips: 8  # of 32
  min_inlier_fraction: 0.75
  max_roll_deg: 3.0
  bootstrap_reps: 2000
  seed: 20261024
sessions:
  sites:
    - {name: lake_constance, latitude_deg: [47.0, 48.0], longitude_deg: [8.5, 10.0]}
    - {name: north_sea, latitude_deg: [53.0, 54.5], longitude_deg: [6.5, 8.0]}
  undated_campaign:  # the paper flew the Trinity F90+ only at Lake Constance in 2020
    trinity_rgb: lake_constance_2020
    trinity_multispectral: lake_constance_2020
splits:
  # B feeds sensor fitting, RL training/validation worlds and level design; T only the final
  # evaluation. Unequal B/T targets also break the tie between swapping two days.
  target_share: {A: 0.6, B: 0.25, T: 0.15}
  usable_camera_groups: [mavic_4k]  # the only group with a fitted camera model (D12)
  altitude_bands_m: [0, 20, 40, 60, 200]
  near_nadir_deg: 30.0
  min_near_nadir_swimmers: 100
  tie_undated_to_campaign: true
  # Sensor models are fitted on B worlds and judged on T worlds: both from open sea. Lake
  # Constance adds variety to detector training (A) only.
  eval_campaigns: [north_sea_2021]
leakage:
  calibration_quantile: 0.95
  positive_max_gap_s: 1.0
  negative_campaigns: [lake_constance_2020, north_sea_2021]
  negative_samples: 20000
  seed: 20261024
scan:
  workers: 24  # the share answers each request after ~3 s; throughput scales with workers
  chunk_size: 200
  keep:  # near-nadir frames that worlds/libraries (M4) can use; everything else is discarded
    camera_groups: [mavic_4k]
    max_off_nadir_deg: 30.0
camera_groups:
  - name: mavic_4k  # DJI Mavic 2 Pro, Hasselblad L1D-20c video frames; DJI flight-log meta
    drone: mavic
    width_px: [3840, 3840]
    height_px: [2160, 2160]
  - name: m210_4k  # DJI Matrice 210 video frames; camera not recorded; DJI flight-log meta
    drone: m210
    width_px: [3840, 3840]
    height_px: [2160, 2160]
  - name: m210_1080p  # Zenmuse Z30 zoom (per folder names); no meta at all
    drone: m210
    width_px: [1920, 1920]
    height_px: [1080, 1080]
  - name: trinity_rgb  # Trinity F90+, Sony UMC-R10C stills, landscape and portrait; no meta
    drone: trinity
    width_px: [3632, 5456]
    height_px: [3632, 5456]
  - name: trinity_multispectral  # MicaSense RedEdge-MX RGB channels, ~1230x933; MicaSense meta
    drone: trinity
    width_px: [1200, 1260]
    height_px: [900, 960]
