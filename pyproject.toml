[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "altiseek"
dynamic = ["version"]
description = "Learning where, and how high, to look for people at sea: altitude-aware drone search in simulation."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Aniket Kumar" }]
# Two Python versions, no more (CLAUDE.md D9): 3.12 for local work and ROS 2 Jazzy, 3.13 on
# Kaggle. CI tests both.
requires-python = ">=3.12,<3.14"
# Direct dependencies are pinned exactly; uv.lock pins the transitive ones. Packages that Kaggle
# preinstalls are pinned to Kaggle's versions (docs/env.md), so cloud installs keep them.
dependencies = [
    "matplotlib==3.10.0",
    "numpy==2.1.3",
    # Used through ultralytics (image I/O, augmentation, tables); pinned to match Kaggle.
    "opencv-python==4.14.0.94",
    "pillow==13.0.0",
    "polars==1.35.2",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics==8.4.184",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.hatch.version]
path = "src/altiseek/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/altiseek"]

[tool.uv]
# Older uv releases trust a compromised CA (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Windows for development; Linux for WSL2, Kaggle and CI. (On macOS, ultralytics excludes our
# numpy pin.)
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# Local and CI environments get CPU-only PyTorch; Kaggle keeps its preinstalled CUDA build, which
# satisfies the same pins (2.11.0+cu128 matches ==2.11.0).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "ANN", # type hints on every signature
    "C4",  # comprehensions
    "SIM", # simplifications
    "PTH", # pathlib over os.path
    "PT",  # pytest style
    "NPY", # numpy
    "RUF", # ruff-specific
]
ignore = [
    "ANN401", # Any is allowed where it is the honest type, e.g. raw YAML values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
